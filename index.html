<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RegVault — Centralized dashboard for Indian regulatory cybersecurity & information security circulars from RBI, SEBI, IRDAI, NPCI, and UIDAI." />
  <meta name="keywords" content="RegVault, RBI circulars, SEBI circulars, IRDAI, NPCI, UIDAI, cybersecurity, information security, regulatory compliance, GRC, India" />
  <meta name="author" content="Rishab Hudlikar" />
  <title>RegVault — Indian Regulatory Circulars Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/index.css" />
</head>
<body>
  <!-- Watermark -->
  <div class="watermark" aria-hidden="true">RegVault</div>

  <!-- Header / Navigation -->
  <header class="header" id="main-header">
    <div class="header__inner">
      <a href="#/" class="header__logo" id="logo-link">
        <svg class="header__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
          <path d="M10 9h12c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H10c-1.1 0-2-.9-2-2V11c0-1.1.9-2 2-2z" stroke="white" stroke-width="1.5" fill="none"/>
          <rect x="11" y="12" width="10" height="1.5" rx=".75" fill="white" opacity=".9"/>
          <rect x="11" y="15.5" width="7" height="1.5" rx=".75" fill="white" opacity=".7"/>
          <rect x="11" y="19" width="8.5" height="1.5" rx=".75" fill="white" opacity=".5"/>
          <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
        </svg>
        <span class="header__logo-text">Reg<span class="header__logo-accent">Vault</span></span>
      </a>
      <nav class="header__nav" id="main-nav">
        <a href="#/" class="header__nav-link active" data-route="/">Dashboard</a>
        <a href="#/search" class="header__nav-link" data-route="/search">Search</a>
      </nav>
      <div class="header__actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-icon theme-icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="theme-icon theme-icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg class="theme-icon theme-icon--system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main" id="app">
    <!-- Pages are rendered here by the router -->
  </main>

  <!-- Footer -->
  <footer class="footer" id="main-footer">
    <div class="footer__inner">
      <p class="footer__credit">Developed by <strong>Rishab Hudlikar</strong> <span class="footer__role">(Risk Advisory Consultant)</span></p>
      <p class="footer__disclaimer">Circulars link to official regulator websites. RegVault does not host or modify any regulatory documents.</p>
    </div>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
